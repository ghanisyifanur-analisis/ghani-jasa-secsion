name: CI

# Pemeriksaan otomatis setiap kali kode di-push / ada pull request.
# Tujuannya: menangkap error sebelum sampai ke server produksi.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Cek sintaks & konfigurasi
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, pdo_pgsql, zip, gd, bcmath, pcntl
          coverage: none

      - name: Validasi composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Cek sintaks semua file PHP
        run: |
          set -e
          count=0
          for f in $(find app bootstrap config database routes -name '*.php'); do
            php -l "$f" > /dev/null
            count=$((count + 1))
          done
          echo "OK: $count file PHP tanpa error sintaks."

      - name: Install dependency
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env untuk build
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Kompilasi semua view Blade
        run: php artisan view:cache

      - name: Pastikan route bisa dibaca
        run: php artisan route:list --except-vendor

  tests:
    name: Unit & feature test (informatif)
    runs-on: ubuntu-latest
    # Tes bawaan repo ini masih menargetkan API "manajemen sekolah" yang
    # belum ada di sini, jadi boleh merah tanpa memblokir deploy.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, pdo_pgsql, zip, gd, bcmath, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan test --colors=always
