name: Build & Publish Image

# OPSIONAL. Situs publik TIDAK memakai Docker (lihat docs/DEPLOY-TANPA-DOCKER.md).
# Image ini hanya dibangun bila Anda tetap ingin menjalankan versi Docker:
# setiap push ke main, image produksi disimpan di GHCR sehingga komputer
# tinggal "pull" dan tidak perlu build ulang.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-src/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Docker image -> ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
