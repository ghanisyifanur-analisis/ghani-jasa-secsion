; supervisord menjalankan dua proses di dalam satu container:
;   - php-fpm  : mesin PHP yang mengeksekusi Laravel
;   - nginx    : web server yang menerima request dari Cloudflare Tunnel
; Kalau salah satu mati, supervisord menyalakannya lagi otomatis.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=5
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
