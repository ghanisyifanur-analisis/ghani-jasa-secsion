user  nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # -----------------------------------------------------------------
    # Situs Laravel
    # -----------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Kalau PHP/Laravel mati, tampilkan halaman ramah (bukan 502 polos)
        error_page 500 502 503 504 /offline.html;

        location = /offline.html {
            internal;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Health-check Laravel (dipakai Docker & PowerShell)
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Aset statis: cache 7 hari
        location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|otf|eot)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            # Cloudflare Tunnel yang menangani HTTPS, jadi Laravel perlu
            # diberi tahu bahwa request aslinya https (agar link & cookie benar).
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_intercept_errors on;
            fastcgi_read_timeout 120;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
