# =====================================================================
# docker-compose.prod.yml
# Jalankan dengan PowerShell (Administrator):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# atau lebih mudah: .\scripts\windows\03-Deploy.ps1
#
# Isi stack:
#   app        -> Laravel + nginx + php-fpm (port 8080, hanya lokal)
#   db         -> PostgreSQL 15 (data disimpan di volume db_data)
#   cloudflared-> terowongan ke Cloudflare, jadi domain bisa diakses publik
# =====================================================================
name: ghani-jasa-secsion

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: ${APP_IMAGE:-ghcr.io/ghanisyifanur-analisis/ghani-jasa-secsion:latest}
    container_name: webcraft_app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      # Hanya bisa diakses dari komputer ini (bukan dari internet).
      # Akses publik tetap lewat Cloudflare Tunnel.
      - "127.0.0.1:8080:8080"
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - webnet

  db:
    image: postgres:15-alpine
    container_name: webcraft_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-webcraft_db}
      POSTGRES_USER: ${DB_USERNAME:-webcraft_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.production}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-webcraft_user} -d ${DB_DATABASE:-webcraft_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - webnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webcraft_tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --loglevel info run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TZ: Asia/Jakarta
    depends_on:
      app:
        condition: service_healthy
    networks:
      - webnet

volumes:
  db_data:
  app_storage:

networks:
  webnet:
    driver: bridge
